# Free Render web service for the Receipts API (the Chrome extension talks to it).
# Docker, so Tesseract OCR is installed for bet-slip screenshots. Disk is ephemeral on the free tier.
services:
  - type: web
    name: receipts-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: VERIFY_WINDOW_DAYS
        value: "4"
      - key: VERIFY_MIN_PICKS
        value: "8"
      - key: VERIFY_MIN_DAYS
        value: "3"
      - key: SHOW_OTHER_VENUES
        value: "true"
